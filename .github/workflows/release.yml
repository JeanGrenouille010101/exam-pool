name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Build Flatpak
        run: |
          flatpak-builder --repo=repo --force-clean --disable-rofiles-fuse build-dir flatpak/io.github.jeangrenouille010101.Ohmwork.json
          flatpak build-bundle repo ohmwork.flatpak io.github.jeangrenouille010101.Ohmwork
          sha256sum ohmwork.flatpak > ohmwork.flatpak.sha256
          cat ohmwork.flatpak.sha256

      - name: Update hosted Flatpak repository
        run: |
          git checkout -B main
          rm -rf docs/flatpak/repo
          cp -a repo docs/flatpak/repo
          git config user.name "Ohmwork release bot"
          git config user.email "ohmwork@users.noreply.github.com"
          git add docs/flatpak/repo
          if ! git diff --cached --quiet; then
            git commit -m "Update Flatpak repository for ${GITHUB_REF_NAME}"
            git push origin main
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ohmwork.flatpak \
            ohmwork.flatpak.sha256 \
            --title "Ohmwork ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Install the Flatpak bundle with:

          \`\`\`sh
          flatpak install --user ohmwork.flatpak
          \`\`\`

          The GNOME 51 runtime is required and can be installed from Flathub."
