name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests tools
      - name: Test
        run: pytest

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.gnome.Platform//51 org.gnome.Sdk//51
      - name: Build Flatpak
        run: |
          flatpak-builder --repo=repo --force-clean --disable-rofiles-fuse build-dir flatpak/io.github.jeangrenouille010101.ExamPool.json
          flatpak build-bundle repo exam-pool.flatpak io.github.jeangrenouille010101.ExamPool
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: exam-pool-flatpak
          path: exam-pool.flatpak
