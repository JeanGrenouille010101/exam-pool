[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ohmwork"
version = "0.4.0"
description = "A native GNOME study app for US amateur radio question pools"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Ohmwork contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.gui-scripts]
ohmwork = "exam_pool.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exam_pool = [
    "resources/pools/*.json",
    "resources/figures/*.png",
    "resources/style.css",
    "settings.gschema.xml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
